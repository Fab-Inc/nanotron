[project]
name = "nanotron"
version = "0.4"
description = "Minimalistic Large Language Model Training and Finetuning"
authors = [
    {name = "Nouamane Tazi", email="nouamane@huggingface.co"},
    {name = "Thomas Wang", email="thomas.wang@huggingface.co"},
    {name = "Kunhao Zheng", email="kunhao@huggingface.co"},
    {name = "Thomas Wolf", email="thomas@huggingface.co"},
]
readme = "README.md"
requires-python = "~=3.11.0"
classifiers = [
    "Topic :: Software Development"
]
dependencies = [
    "torch>=1.13.1",
    "pyyaml",
    "numpy<2",
    "packaging",
    "safetensors",
    "dacite",
    "tqdm",
    "datasets",
    "torchtyping",
]

[tool.ruff]
line-length = 119
ignore = ["C901","E501"] # E501 ignores length violation handled by black
select = ["C","E","F","I","W"]
ignore-init-module-imports = true

[tool.uv.extra-build-dependencies]
flash-attn = ["wheel", "torch", "psutil"]

[tool.uv]
no-build-isolation-package = ['flash-attn']

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = {index = "pytorch"}

[dependency-groups]
dev = [
    "wheel",
    "psutil",
    "pre-commit",
    "pylint"
]

test = [
    "pytest",
    "pytest-xdist"
]

fast-modeling = [
    "flash-attn>=2.5.0,<2.7.0",
]

nanosets = [
     "transformers",
     "datatrove[io,processing]",
     "numba",
]

s3 = [
    "boto3",
    "s3fs",
    "s5cmd",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanotron"]

[pytest]
norecursedirs="tests/helpers"